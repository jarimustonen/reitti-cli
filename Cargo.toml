# reitti workspace — §22 core/cli split (the AI-first CLI family's canonical shape).
[workspace]
resolver = "2"
members = ["crates/reitti-core", "crates/reitti-cli"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
rust-version = "1.88"
repository = "https://github.com/jarimustonen/reitti-cli"
homepage = "https://github.com/jarimustonen/reitti-cli"
description = "Agent-first command-line journey planner for the HSL service area"

[workspace.dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde", "std"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
thiserror = "2.0.16"

# shipshape-dist:managed — cargo-dist build profile; refresh with /shipshape-dist.
[profile.dist]
inherits = "release"
lto = "thin"
