[package]
name = "reitti-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true
publish = ["crates-io"]
readme = "README.md"
build = "build.rs"

[package.metadata.dist]
dist = true

[[bin]]
name = "reitti"
path = "src/main.rs"

[dependencies]
chrono.workspace = true
chrono-tz = "0.10.4"
clap = { version = "4.5.47", features = ["derive"] }
fs2 = "0.4.3"
libc = "0.2.175"
reitti-core = { path = "../reitti-core", version = "=1.0.0" }
reqwest = { version = "0.12.23", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3.31"
httpdate = "1.0.3"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1.53.0", features = ["net", "rt", "time"] }
toml = "0.9.5"
ulid = "1.2.1"
url = "2.5.7"

[dev-dependencies]
assert_cmd = "2.0.17"
jsonschema = { version = "0.29.1", default-features = false }
predicates = "3.1.3"
tempfile = "3.22.0"
tokio = { version = "1.53.0", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
