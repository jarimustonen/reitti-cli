# Generated by `shipshape dist generate` from OSS-RELEASE.md `distribution`.
# Edit distribution.* in OSS-RELEASE.md, then re-run `shipshape dist generate`.
# The tag-triggered `.github/workflows/release.yml` is produced from the
# [dist] section below via `dist generate` — never hand-edit the workflow.
[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.28.2"
ci = "github"
installers = ["shell", "homebrew"]
tap = "jarimustonen/homebrew-reitti"
publish-jobs = ["homebrew"]
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-musl",
    "x86_64-unknown-linux-musl",
]
hosting = "github"
github-attestations = true
pr-run-mode = "skip"
github-build-setup = "../build-setup.yml"

[dist.github-custom-runners]
aarch64-apple-darwin = "self-hosted"
