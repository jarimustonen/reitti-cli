# shipshape-ci:managed — regenerated by /shipshape-ci; edit OSS-RELEASE.md and re-run
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, "1.88.0"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install "${{ matrix.toolchain }}" --profile minimal
      - name: Test workspace
        run: cargo +"${{ matrix.toolchain }}" test --locked --workspace
      - name: Check credential-free Digitransit fixtures
        if: matrix.toolchain == 'stable'
        run: python3 scripts/probe-digitransit.py check
      - name: Check formatting and lints
        if: matrix.toolchain == 'stable'
        run: |
          rustup component add rustfmt clippy --toolchain stable
          cargo +stable fmt --all --check
          cargo +stable clippy --locked --workspace --all-targets -- -D warnings

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
